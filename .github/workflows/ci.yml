name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PoiResize.sln

      - name: Build
        run: dotnet build PoiResize.sln -c Release --no-restore

      - name: Test
        run: dotnet test PoiResize.sln -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # 単一ファイル exe が作れることも毎回確かめる（成果物は 7 日だけ残す）
      - name: Publish (smoke)
        run: dotnet publish src/PoiResize.App/PoiResize.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PoiResize-ci-win-x64
          path: publish/PoiResize.exe
          retention-days: 7
